version: "3"

vars:
  PNPM: pnpm

tasks:
  install:
    desc: Install dependencies
    cmds:
      - "{{.PNPM}} install --frozen-lockfile"

  format:
    desc: Auto-format all files
    cmds:
      - "{{.PNPM}} run format"

  format:check:
    desc: Check formatting
    cmds:
      - "{{.PNPM}} run format:check"

  lint:
    desc: Run ESLint
    cmds:
      - "{{.PNPM}} run lint"

  lint:fix:
    desc: Auto-fix lint issues
    cmds:
      - "{{.PNPM}} run lint:fix"

  typecheck:
    desc: TypeScript type check
    cmds:
      - "{{.PNPM}} run typecheck"

  test:
    desc: Run unit and component tests
    cmds:
      - "{{.PNPM}} run test"

  test:e2e:
    desc: Run Playwright end-to-end tests
    cmds:
      - "{{.PNPM}} run test:e2e"

  test:a11y:
    desc: Run Playwright accessibility checks
    cmds:
      - "{{.PNPM}} run test:a11y"

  build:
    desc: Production build
    cmds:
      - "{{.PNPM}} run build"
    env:
      NEXT_TELEMETRY_DISABLED: "1"

  dev:
    desc: Start dev server
    cmds:
      - "{{.PNPM}} run dev"

  security:
    desc: Run local security checks
    cmds:
      - "{{.PNPM}} run security"

  link:check:
    desc: Check documentation links
    cmds:
      - "{{.PNPM}} run link:check"

  badge:check:
    desc: Check README badge image and target URLs
    cmds:
      - "{{.PNPM}} run badge:check"

  release:dry-run:
    desc: Validate release automation without creating a release
    cmds:
      - "{{.PNPM}} run release:dry-run"

  ci:
    desc: Run full local CI
    deps: [install]
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: test
      - task: test:e2e
      - task: test:a11y
      - task: security
      - task: link:check
      - task: badge:check
      - task: release:dry-run
      - task: build
