name: "Feature Request"
description: "Suggest a new section or improvement"
labels: ["type:feat"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Describe the feature"
      placeholder: "What would you like to see added or changed?"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "Motivation"
      placeholder: "Why would this be useful?"
