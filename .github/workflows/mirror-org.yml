name: Mirror to Org

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  mirror:
    name: Mirror to oaslananka-lab/oaslananka.github.io
    if: github.repository == 'oaslananka/oaslananka.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to org mirror
        env:
          ORG_MIRROR_TOKEN: ${{ secrets.ORG_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORG_MIRROR_TOKEN}" ]; then
            echo "ORG_MIRROR_TOKEN is not configured; skipping mirror."
            exit 0
          fi
          git config user.email "ci-mirror@github.com"
          git config user.name "CI Mirror Bot"
          git remote add org \
            "https://x-access-token:${ORG_MIRROR_TOKEN}@github.com/oaslananka-lab/oaslananka.github.io.git"
          git push org HEAD:main --force
