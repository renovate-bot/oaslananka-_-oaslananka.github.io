name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Gitleaks
    if: github.repository == 'oaslananka-lab/oaslananka.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for leaked secrets
        run: |
          set -euo pipefail
          version="8.30.1"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"
          curl -sSfLO "${base_url}/${archive}"
          curl -sSfLO "${base_url}/${checksums}"
          grep " ${archive}$" "${checksums}" | sha256sum --check -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
          gitleaks detect --source . --verbose --redact

  trivy:
    name: Trivy filesystem
    if: github.repository == 'oaslananka-lab/oaslananka.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        if: always()
        with:
          sarif_file: trivy-results.sarif

  pnpm-audit:
    name: pnpm audit
    if: github.repository == 'oaslananka-lab/oaslananka.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788
        with:
          version: 11.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --prod

  osv-scanner:
    name: OSV Scanner
    if: github.repository == 'oaslananka-lab/oaslananka.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Scan lockfile with OSV
        run: |
          set -euo pipefail
          version="2.3.8"
          base_url="https://github.com/google/osv-scanner/releases/download/v${version}"
          binary="osv-scanner_linux_amd64"
          checksums="osv-scanner_SHA256SUMS"
          curl -sSfLO "${base_url}/${binary}"
          curl -sSfLO "${base_url}/${checksums}"
          grep " ${binary}$" "${checksums}" | sha256sum --check -
          chmod +x "${binary}"
          ./"${binary}" --lockfile=pnpm-lock.yaml

  scorecard:
    name: OSSF Scorecard
    if: >-
      github.repository == 'oaslananka-lab/oaslananka.github.io' &&
      (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          sarif_file: scorecard-results.sarif

  workflow-security:
    name: zizmor
    if: github.repository == 'oaslananka-lab/oaslananka.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41

      - name: Audit workflow security
        run: |
          set -euo pipefail
          uvx zizmor .github/workflows/ --min-severity medium
