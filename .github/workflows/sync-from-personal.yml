name: Sync From Personal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-from-personal
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  parity:
    name: Verify personal/org parity
    if: github.repository == 'oaslananka-lab/oaslananka.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PERSONAL_REPO: oaslananka/oaslananka.github.io
      ORG_REPO: oaslananka-lab/oaslananka.github.io
    steps:
      - name: Compare default branches and release tags
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          git clone --filter=blob:none "https://github.com/${PERSONAL_REPO}.git" "${workdir}/personal"
          git clone --filter=blob:none "https://github.com/${ORG_REPO}.git" "${workdir}/org"

          personal_head="$(git -C "${workdir}/personal" rev-parse HEAD)"
          org_head="$(git -C "${workdir}/org" rev-parse HEAD)"
          test "${personal_head}" = "${org_head}"

          personal_tags="$(git -C "${workdir}/personal" tag --list 'v*' --sort=refname)"
          org_tags="$(git -C "${workdir}/org" tag --list 'v*' --sort=refname)"
          test "${personal_tags}" = "${org_tags}"
