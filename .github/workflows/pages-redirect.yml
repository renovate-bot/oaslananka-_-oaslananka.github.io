name: GitHub Pages Redirect

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build redirect artifact
        shell: bash
        run: |
          mkdir -p dist
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Redirecting to oaslananka.dev</title>
              <meta http-equiv="refresh" content="0; url=https://oaslananka.dev/" />
              <meta name="robots" content="noindex, nofollow" />
              <link rel="canonical" href="https://oaslananka.dev/" />
              <script>
                window.location.replace('https://oaslananka.dev/');
              </script>
            </head>
            <body>
              <p>
                Redirecting to <a href="https://oaslananka.dev/">oaslananka.dev</a>.
              </p>
            </body>
          </html>
          EOF
          cp dist/index.html dist/404.html
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
